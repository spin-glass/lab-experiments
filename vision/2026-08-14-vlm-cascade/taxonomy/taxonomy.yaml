# taxonomy.yaml — クラス定義の正本（docs/taxonomy.md §3・§6、design.md §4）
#
# 手編集するのは taxonomy/ 配下でこのファイルのみ。prompts.json / label_master.csv /
# taxonomy.ttl / taxonomy_tree.md / taxonomy.svg は taxonomy_build.py / taxonomy_viz.py の生成物。
#
# 項目名は SKOS から借用する（prefLabel / altLabel / definition / scopeNote / broader / changeNote）。
# - id        : node_id（snake_case）。プロンプト・ルール・評価スライス・レポートの結合キー
# - prefLabel : 正式名（ja）
# - altLabel  : 言語タグ付きの別名。en は CLIP 用プロンプト文（第2・第3階層のみ。Stage1 の入力）
# - definition: 定義（ja）
# - scopeNote : 適用範囲の注記（ja、任意）。優先規則そのものは rulebook.md に置き、ここでは参照に留める
# - broader   : 親 id（第1階層は null）
# - level     : 1 = ブランチ（food / non-food。ゴールドに記録せず導出のみ）
#               2 = 運用クラス（ちょうど 5。ゴールドに記録する）
#               3 = プロンプト用サブクラス・誤爆吸収クラス（v0.1 では未定義。M1 で追加）
#
# 語彙とポリシーを混ぜない: 優先規則・品質規則・運用写像は rulebook.md（CLAUDE.md 絶対制約）。

scheme:
  id: yelp-restaurant-photos
  version: 0.1.0
  prefLabel: レストラン写真の2階層タクソノミー
  definition: Yelp Open Dataset のレストラン写真を第1階層（food / non-food ブランチ）と第2階層（運用5クラス）で分類する is-a 木。第3階層（プロンプト用サブクラス）は M1 で追加する。
  changeNote:
    - "0.1.0 (2026-09-07): 初版。第1階層 2 ブランチ・第2階層 5 運用クラス。第3階層なし。プロンプトは素朴なフラット版（M1 で調整）"

constraints:
  # 同一レベルの兄弟は相互排他（1 画像 1 クラス）
  exclusive: true
  # 兄弟の合併が親を網羅する（第2階層の 5 クラスで対象内画像を尽くす。対象外は scope_annotations の out_of_scope。G0 / D14）
  exhaustive: true
  # 第1階層は記録せず、第2階層の親として導出する（taxonomy.md T2）
  derive_level1: parent(level2)

concepts:
  # ---------------------------------------------------------------- 第1階層（ブランチ）
  - id: food_branch
    level: 1
    broader: null
    prefLabel: 料理ブランチ
    altLabel:
      en: []
    definition: 主被写体が料理である画像のブランチ。二値フラグ（food / not-food）の吸収先であり、ゴールドには記録せず第2階層の親として導出する。
    scopeNote: 第1階層の確信度は Stage1 の branch_margin = S_food − S_non として Stage2 に渡す（design.md §1）。

  - id: non_food_branch
    level: 1
    broader: null
    prefLabel: 非料理ブランチ
    altLabel:
      en: []
    definition: 主被写体が料理ではない画像のブランチ。「料理でない」という否定を、配下の肯定クラス（drink / menu / inside / outside）の列挙で表現する。
    scopeNote: 否定プロンプトは使わない（CLIP 系エンコーダは否定を扱えない。taxonomy.md §3）。

  # ---------------------------------------------------------------- 第2階層（運用クラス。順序 = class_order）
  - id: food
    level: 2
    broader: food_branch
    prefLabel: 料理
    altLabel:
      en:
        - a photo of food served at a restaurant
        - a photo of a dish on a table
        - a photo of a plate of food
        - a close-up photo of a meal
    definition: 皿・丼・器に盛られた料理、または食材そのものが主被写体である画像。デザート・パン・スナックを含む。
    scopeNote: 料理と飲み物が同格で写る場合の優先順位、料理写真入りメニューページ・店頭の料理ディスプレイの扱いは rulebook.md の優先規則で決める（現行案は food 優先。D13）。

  - id: drink
    level: 2
    broader: non_food_branch
    prefLabel: 飲み物
    altLabel:
      en:
        - a photo of a drink served at a restaurant
        - a photo of beverages on a table
        - a photo of a cocktail in a glass
        - a photo of a cup of coffee
    definition: グラス・カップ・ボトルに入った飲料が主被写体である画像。アルコール飲料・コーヒー・ジュース・スムージーを含む。
    scopeNote: 料理が同格で写る場合は rulebook.md の優先規則に従う。

  - id: menu
    level: 2
    broader: non_food_branch
    prefLabel: メニュー
    altLabel:
      en:
        - a photo of a restaurant menu
        - a photo of a printed menu
        - a photo of a menu board on the wall
    definition: 印刷されたメニュー、黒板・掲示のメニューボード、価格表など、提供品目を列挙した文書が主被写体である画像。
    scopeNote: 料理写真が大きく載ったメニューページも menu（属性 food_visible は別フィールドで持つ。taxonomy.md §4）。

  - id: inside
    level: 2
    broader: non_food_branch
    prefLabel: 店内
    altLabel:
      en:
        - a photo of the interior of a restaurant
        - a photo of a restaurant dining room
        - a photo of tables and chairs inside a restaurant
        - a photo of a bar counter inside a restaurant
    definition: 店舗の内部空間（客席・カウンター・厨房・内装）を主被写体とする画像。店内で撮られていても、料理・飲み物・メニューが主被写体ならそれぞれのクラスに属する。
    scopeNote: 料理の載ったテーブルを含む店内カット・食事中の人物は誤爆吸収クラスの候補（M1 で第3階層として追加。D13）。

  - id: outside
    level: 2
    broader: non_food_branch
    prefLabel: 店外
    altLabel:
      en:
        - a photo of a restaurant storefront
        - a photo of the exterior of a restaurant building
        - a photo of a restaurant sign seen from the street
        - a photo of an outdoor patio of a restaurant
    definition: 店舗の外観（ファサード・看板・入口・テラス席・周辺の街路）を主被写体とする画像。
    scopeNote: 店頭の料理ディスプレイ・ショーケースは誤爆吸収クラスの候補（M1 で第3階層として追加。D13）。

  # ---------------------------------------------------------------- 第3階層（v0.1 では未定義。M1 で追加）
  # 例（M1 で実データの precision 監査を経て追加する。ここでは有効化しない）:
  # - id: menu_with_food_photos
  #   level: 3
  #   broader: menu
  #   prefLabel: 料理写真入りメニューページ
  #   altLabel: {en: ["a photo of a menu page with pictures of dishes"]}
  #   definition: ...
