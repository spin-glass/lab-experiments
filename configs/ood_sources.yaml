# 外部候補画像の取得設定（G0 層 A / ソース対照正例 / 補助 far）。design.md §2・§5、docs/g0_nonfood_plan.md。
# 外部 ID・MID・カテゴリは 2026-09-07 に実在確認済み。画像は data/ext/ に落とし git 管理外。
# コミットするのは本ファイルと configs/ood_sources.lock（ID・sha256・ライセンス）のみ。

# 連絡先は env CASCADE_CONTACT（Commons は連絡先の無い汎用 UA を 403 で拒否）。config へのベタ書きはしない。
user_agent: "lab-vlm-cascade/0.1 ({contact}) python-requests/{requests_version}"
contact: null

throttle:
  min_interval_sec: 0.5     # ≤ 2 req/s（Commons の要請）
  max_retries: 5
  backoff_base_sec: 1.0
  timeout_sec: 60

# 縮小案（plan v4 「時間が無い場合の削減順」）: 主型 120、near_food_nonfood 80、food_contrast 100、cord 200
targets:
  default: 120
  doll_character_statue: 120
  amusement_tourist: 120
  signage_decor_goods: 120
  person_animal: 120
  vehicle_street: 120
  near_food_nonfood: 80
  food_contrast: 100
  texture_document_screen: 200   # CORD-v2（補助 far）
candidate_multiplier: 2          # 目標の 2 倍を決定的順序で抽出（型予算 = target × 2 を提供源で均等配分。合計 ≈ 2 倍）
per_class_cap: 40                # 型内クラス別上限（Flower / Person / Poster の独占防止。Open Images は split 横断で数える）
min_side: 256                    # min(width, height) の下限（Commons の 500px サムネ基準）
manifest_flush_every: 20         # マニフェスト（再開の正本）を何件ごとに書くか

# LicenseShortName（Commons）/ URL から正規化した短縮名（Open Images: "CC BY 2.0" 等）に対する正規表現（大文字小文字無視）。
# Commons と Open Images の両方に適用する。NC / ND は通さない。帰属行が無い・不明ライセンスの画像は棄却。
license_allowlist:
  - '^CC0'
  - '^CC BY(-SA)? \d(\.\d)?'
  - '^CC-BY(-SA)?-\d(\.\d)?'
  - '^Public domain'
  - '^PD'
  - '^No restrictions'

# subject_type → 源ごとの抽出ラベル。順序は「1 画像 1 型」の優先順（先勝ち）。
subject_types:
  doll_character_statue:
    open_images:
      "/m/0167gd": Doll
      "/m/0kmg4": Teddy bear
      "/m/0153bq": Mascot
      "/m/013_1c": Statue
      "/m/06msq": Sculpture
      "/m/01xmqj": Figurine
    commons:
      - Stuffed animals
      - Plush toys
      - Teddy bears
      - Mascot costumes
      - Kigurumi
      - Fursuits
      - Statues of mascots
      - Maneki neko
      - Shigaraki ware Tanuki statues
  amusement_tourist:
    open_images:
      "/m/010jjr": Amusement park
      "/m/017rgb": Ferris wheel
      "/m/010l12": Roller coaster
      "/m/01pwdc": Carousel
      "/m/01h_1n": Playground
      "/m/02y929": Swing (Seat)
      "/m/0220r2": Fountain
