  # （sha256 84a4373a0efb7fd6d93fe19b0e7ceb6c1b855c233d13b9b78a9a33655c9fdce3、20,931 クラス）の DisplayName を
  # 語境界一致のキーワード {Food, Dish, Fast food, Dessert, Pizza, Cake, Bread, Fruit, Vegetable, Snack, Drink, Coffee,
  # Juice, Baked goods, Seafood, Meat, Salad, Sandwich, Sushi, Noodle, Soup, Ice cream, Candy, Chocolate, Cookie, Cheese,
  # Breakfast, Lunch, Dinner, Cuisine, Junk food, Street food, Dairy, Egg, Beer, Wine, Cocktail, Tea}（複数形可）で拾い、
  # 非可食の語義（道具・容器・家具・植物・動物・場所・行事・抽象概念: Coffee table, Cocktail dress, Dish rack, Wine glass,
  # Egg hunt, Fruit tree, Food truck 等 95 件）を手で除いた 670 件。値は DisplayName（参照用）。ピン留め済み・手編集で更新する。
