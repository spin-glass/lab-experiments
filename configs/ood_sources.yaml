      - Ferris wheels
      - Carousels
  signage_decor_goods:
    open_images:
      "/m/01knjb": Billboard
      "/m/01n5jq": Poster
      "/m/01j51": Balloon
      "/m/01jfsr": Lantern
      "/m/025nd": Christmas tree
      "/m/0bkqqh": Signage
    commons:
      - Toy balloons
      - Decoration with balloons
      - Paper lanterns in Japan
      - Christmas decorations
      - Shop windows with Christmas decorations
      - Restaurant menu signs
      - Handwritten menus
      - Restaurant signs
  person_animal:
    open_images:
      "/m/01g317": Person
      "/m/0bt9lr": Dog
      "/m/01yrx": Cat
    coco: [person, dog, cat, horse, sheep, cow, elephant, bear, zebra, giraffe, bird]
    commons:
      - Selfies taken indoors
      - Group selfies
  vehicle_street:
    open_images:
      "/m/0k4j": Car
      "/m/01bjv": Bus
      "/m/07jdr": Train
      "/m/0cgh4": Building
      "/m/079cl": Skyscraper
    coco: [car, bus, train, truck, bicycle, motorcycle, boat]
  near_food_nonfood:               # Open Images は Food 明示 negative を要求
    open_images:
      "/m/050gv4": Plate
      "/m/04kkgm": Bowl
      "/m/04brg2": Tableware
    commons:
      - Food samples
      - Food samples in Japan
      - Toy food
      - Empty plates
      - Dirty dishes
      - Leftovers
  food_contrast:                   # ソース対照正例。Open Images は Food positive を要求
    open_images:
      "/m/02wbm": Food
      "/m/02q08p0": Dish
  texture_document_screen:
    hf: [cord]

open_images:
  food_mid: "/m/02wbm"
  class_descriptions_url: https://storage.googleapis.com/openimages/v7/oidv7-class-descriptions.csv
  # 料理系として除外する MID（food_mid に加えて positive なら非料理候補から外す。food_contrast はこの集合の positive を要求）。
