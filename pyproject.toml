[project]
name = "lab-vlm-cascade"
version = "0.1.0"
description = "曖昧クラスを含む画像分類のカスケード＋判定層＋監査ループ — 一般実装と数値検証（Yelp Open Dataset）"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  # 版は 2026-09-07 に PyPI で確認してピン留め（CLAUDE.md: 外部情報は実行時に確認）
  "torch==2.14.0",
  "torchvision==0.29.0",
  "open_clip_torch==3.3.0",
  "transformers==5.16.1",
  "huggingface_hub==1.30.0",
  "safetensors==0.8.0",
  "numpy==2.5.3",
  "scipy==1.18.1",
  "scikit-learn==1.9.0",
  "pillow==12.3.0",
  "imagehash==4.3.2",
  "duckdb==1.5.5",
  "pyarrow==25.0.1",
  "polars==1.44.1",
  "pyyaml==6.0.3",
  "typer==0.27.2",
  "requests==2.34.2",
  "boto3==1.43.89",
  "rdflib==7.6.0",
  "wandb==0.29.0",
  "google-cloud-aiplatform==2.1.0",
  "pytz==2026.3.post1",
  "matplotlib==3.11.1",
]

[dependency-groups]
dev = [
  "ruff==0.16.6",
  "pytest==9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cascade"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "taxonomy", "scripts", "analysis"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests", "taxonomy"]
addopts = "-q"
pythonpath = ["src"]
